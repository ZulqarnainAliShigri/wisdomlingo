name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 5 minutes (standard cron expression)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL or SUPABASE_ANON_KEY not set. Skipping ping."
            exit 0
          fi
          # Clean BASE_URL so it works whether user entered https://xyz.supabase.co or https://xyz.supabase.co/rest/v1/
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed 's|/rest/v1/*$||' | sed 's|/*$||')
          echo "Target URL: $CLEAN_URL"
          echo "Pinging Supabase database to keep it active..."
          
          # Ping the PostgREST root endpoint (which returns OpenAPI spec with 200 OK and keeps PostgREST warm)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/rest/v1/")
          
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Supabase ping successful! Database is active and warm."
          else
            echo "Warning: Received HTTP $STATUS from Supabase."
            # Also print response body for easy debugging if not 200
            curl -s -H "apikey: $SUPABASE_ANON_KEY" "$CLEAN_URL/rest/v1/" | head -c 200
            echo ""
          fi
