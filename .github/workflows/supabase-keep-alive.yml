name: Supabase Keep-Alive Ping

on:
  schedule:
    # Runs every 5 minutes (standard cron expression)
    - cron: '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "Secrets SUPABASE_URL or SUPABASE_ANON_KEY not set. Skipping ping."
            exit 0
          fi
          # Clean BASE_URL
          CLEAN_URL=$(echo "$SUPABASE_URL" | sed 's|/rest/v1/*$||' | sed 's|/*$||')
          echo "Target URL: $CLEAN_URL"
          echo "Pinging Supabase to keep project active..."
          
          # 1. Ping Auth Health (wakes up the Supabase project container)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/auth/v1/health")
          
          echo "Auth Health HTTP Status: $STATUS"
          
          # 2. Ping Database REST API table/rpc query
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$CLEAN_URL/rest/v1/courses?select=id&limit=1")
          
          echo "Database REST HTTP Status: $DB_STATUS"
          
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Supabase ping successful! Project and database are active and warm."
          elif [ "$DB_STATUS" -ge 200 ] && [ "$DB_STATUS" -lt 400 ]; then
            echo "Supabase database ping successful! Active and warm."
          else
            echo "Warning: Response status Auth=$STATUS, DB=$DB_STATUS"
          fi
