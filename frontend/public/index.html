<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1E40AF" />
    <meta
      name="description"
      content="WisdomLingo - German language courses (A1 to C2), IELTS and spoken English, Quran, Arabic and Persian classes, study abroad counselling for six European countries, and paid apprenticeships in Germany."
    />
    <meta name="keywords" content="German language course, Ausbildung, study abroad, IELTS, Goethe exam, WisdomLingo" />

    <!-- Social preview. After deploying, set og:url and the canonical link to your domain. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WisdomLingo" />
    <meta property="og:title" content="WisdomLingo | German Language Academy and Consultancy" />
    <meta
      property="og:description"
      content="German A1-C2, IELTS, study abroad guidance for Germany, Sweden, Cyprus, Turkey, Austria and Switzerland, plus paid apprenticeships."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Replace with the absolute URL (https://yourdomain.com/images/logo.png) after deploying. -->
    <meta property="og:image" content="%PUBLIC_URL%/images/logo.png" />

    <link rel="icon" href="%PUBLIC_URL%/favicon.ico?v=4" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/images/favicon-32.png?v=4" />
    <link rel="icon" type="image/png" sizes="192x192" href="%PUBLIC_URL%/images/icon-192.png?v=4" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png?v=4" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <title>WisdomLingo | Education Consultancy</title>

    <!--
      Structured data so Google can connect this website to the Google Business
      Profile "Wisdomlingo German language Academy and consultancy".
      Add the live site URL to "url" and "sameAs" after deploying.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": ["EducationalOrganization", "LocalBusiness"],
        "name": "Wisdomlingo German Language Academy and Consultancy",
        "alternateName": "WisdomLingo",
        "description": "German language courses from A1 to C2, IELTS and spoken English, Quran, Arabic and Persian classes, study abroad counselling and paid apprenticeship placement in Germany.",
        "logo": "%PUBLIC_URL%/images/logo.png",
        "telephone": "+92-311-8526814",
        "email": "info@wisdomlingo.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "House 3A, Park Road, F-8/1",
          "addressLocality": "Islamabad",
          "addressRegion": "Islamabad Capital Territory",
          "postalCode": "44000",
          "addressCountry": "PK"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 33.7102734,
          "longitude": 73.0321496
        },
        "areaServed": "PK",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday"
            ],
            "opens": "09:00",
            "closes": "20:00"
          }
        ],
        "hasMap": "https://share.google/MD63jEY3xJEpiUtS2",
        "sameAs": ["https://share.google/MD63jEY3xJEpiUtS2"]
      }
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
