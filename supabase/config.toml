# Supabase CLI configuration (only needed for `supabase start` / `supabase db push`).
# The dashboard SQL Editor works without this file.

project_id = "wisdomlingo"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "5MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3001"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
# Admin accounts are created by hand in the dashboard, so public signup stays off.
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false
